# Test-only overrides: H2 in-memory DB + dummy credentials, so tests never
# touch the real Supabase DB or real admin/JWT secrets.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
JWT_SECRET=test-only-dummy-secret-that-is-long-enough-0123456789
daybuy.admin.username=testadmin
daybuy.admin.password=testpass123
daybuy.ingest.key=testkey
daybuy.site.base-url=http://localhost:8080
