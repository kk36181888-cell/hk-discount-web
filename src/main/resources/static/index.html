<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全港著數優惠網 | Premium</title>
    <!-- 引入極粗字體，模仿片中嘅現代感 -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
        
        /* 透明懸浮導航列 */
        nav {
            position: fixed; top: 0; width: 100%; padding: 25px 50px; 
            display: flex; justify-content: space-between; z-index: 999;
            box-sizing: border-box; text-transform: uppercase; font-weight: 600; letter-spacing: 2px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
        }
        .nav-logo { font-family: 'Anton', sans-serif; font-size: 24px; letter-spacing: 4px; }
        .nav-links { display: flex; gap: 40px; }

        /* 首頁全螢幕大橫幅 */
        .hero {
            height: 100vh; position: sticky; top: 0; z-index: 1;
            display: flex; align-items: center; justify-content: center;
            /* 暫時用一張靚嘅超市相做背景 */
            background: url('https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
        }
        .hero::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
        .hero-title {
            font-family: 'Anton', sans-serif; font-size: 12vw; line-height: 0.85; 
            text-transform: uppercase; text-align: center; z-index: 2; margin: 0;
            color: #fff; letter-spacing: -2px;
        }

        /* 每一個優惠的全螢幕區塊 */
        .discount-section {
            height: 100vh; position: sticky; top: 0; z-index: 2;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 120px 50px 50px 50px; box-sizing: border-box;
            background-size: cover; background-position: center;
            box-shadow: 0 -20px 50px rgba(0,0,0,0.5); /* 堆疊時嘅陰影效果 */
        }
        /* 底部黑色漸變，確保白色字清晰可見 */
        .discount-section::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.1) 60%);
        }
        
        .discount-meta { font-size: 1.2rem; letter-spacing: 4px; text-transform: uppercase; color: #ccc; }
        .discount-title {
            font-family: 'Anton', sans-serif; font-size: 8vw; line-height: 1; 
            text-transform: uppercase; margin: 0; max-width: 80%;
        }
        .merchant-tag {
            display: inline-block; padding: 10px 20px; border: 2px solid #fff; 
            border-radius: 30px; font-weight: 600; margin-top: 20px; transition: 0.3s;
        }
        .merchant-tag:hover { background: #fff; color: #000; cursor: pointer; }
        
        /* 載入中/錯誤提示 */
        .message-box { height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; z-index: 10; background: #111;}
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">JETSO FINDER</div>
        <div class="nav-links">
            <span>Experiences</span>
            <span>Sanctuary</span>
            <span>Reserve /</span>
        </div>
    </nav>

    <!-- 主視覺 -->
    <div class="hero">
        <h1 class="hero-title">ESCAPE<br>COMPLETELY</h1>
    </div>

    <!-- 自動生成的全螢幕優惠區塊 -->
    <div id="dynamic-content">
        <div class="message-box">LOADING JOURNEY...</div>
    </div>

    <script>
        // 用來隨機抽相嘅庫 (因為你 Database 暫時未有相)
        const bgImages = [
            'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1604719312566-8912e9227c6a?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1534723452862-4c874018d66d?auto=format&fit=crop&w=1920&q=80'
        ];

        fetch('/api/discounts')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('dynamic-content');
                container.innerHTML = ''; 

                if (data.length === 0) {
                    container.innerHTML = '<div class="message-box">NO OFFERS AVAILABLE</div>';
                    return;
                }

                data.forEach((discount, index) => {
                    // 輪流用上面嘅相
                    const bgImage = bgImages[index % bgImages.length];
                    // 補零效果 (例如 01, 02)
                    const serialNumber = '0' + (index + 1);

                    const sectionHtml = `
                        <div class="discount-section" style="background-image: url('${bgImage}');">
                            <div class="discount-meta">${serialNumber} — ${discount.category || 'FEATURED'}</div>
                            <div>
                                <h2 class="discount-title">${discount.title}</h2>
                                <div class="merchant-tag">EXPLORE ${discount.merchantName || 'MERCHANT'}</div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += sectionHtml;
                });
            })
            .catch(error => {
                document.getElementById('dynamic-content').innerHTML = '<div class="message-box text-danger">SYSTEM OFFLINE</div>';
            });
    </script>
</body>
</html>
