<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayBuy 抵Buy - 全港著數導航</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #ffffff; 
            color: #333333; 
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; 
        }
        
        .top-header { background-color: #FFDE00; padding: 15px 0; border-bottom: 1px solid #e0c200; }
        .brand-logo { font-size: 2rem; font-weight: bold; color: #000; text-decoration: none; }
        .brand-logo i { color: #000; }
        
        .search-bar { background-color: #fff; border-radius: 6px; border: 2px solid #000; display: flex; align-items: center; padding: 2px 15px; }
        .search-bar input { border: none; outline: none; width: 100%; padding: 10px; color: #333; font-size: 1rem; }
        .search-bar i { color: #555; font-size: 1.2rem; }

        .sub-nav { background-color: #FFDE00; border-bottom: 2px solid #000; margin-bottom: 40px; }
        .sub-nav a { color: #000; text-decoration: none; padding: 12px 25px; display: inline-block; font-weight: bold; transition: background-color 0.2s; }
        .sub-nav a:hover, .sub-nav a.active { background-color: #000; color: #FFDE00; }

        /* 圖片分類卡片設計 */
        .categories-section { margin-bottom: 40px; }
        .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .category-header h4 { font-weight: bold; margin: 0; color: #000; }
        .category-header a { color: #666; text-decoration: none; font-size: 0.95rem; }
        .category-header a:hover { color: #000; }
        
        .category-card {
            height: 280px;
            border-radius: 12px;
            position: relative;
            background-size: cover;
            background-position: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            cursor: pointer;
        }
        .category-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        
        .category-title {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-weight: bold;
            font-size: 1.25rem;
            z-index: 2;
            margin: 0;
        }
        .category-arrow {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            color: black;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .section-title { font-weight: bold; margin-bottom: 25px; color: #000; border-left: 5px solid #FFDE00; padding-left: 12px; }
        
        /* 惠康 Banner 樣式 */
        .wellcome-banner-card {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
            background: #fff;
            margin-bottom: 25px;
        }
        .wellcome-banner-card:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="container d-flex flex-wrap align-items-center justify-content-between">
            <div class="col-md-3">
                <a href="index.html" class="brand-logo"><i class="fa-solid fa-tags me-2"></i>DayBuy</a>
            </div>
            <div class="col-md-6">
                <div class="search-bar">
                    <input type="text" placeholder="搜尋例如：可口可樂、百佳、壽司郎...">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            <div class="col-md-3"></div>
        </div>
    </header>

    <nav class="sub-nav text-center">
        <div class="container">
            <a href="index.html" class="active"><i class="fa-solid fa-house me-2"></i>首頁</a>
            <a href="supermarket.html"><i class="fa-solid fa-fire me-2"></i>超市著數</a>
            <a href="#"><i class="fa-solid fa-circle-question me-2"></i>常見問題</a>
        </div>
    </nav>

    <!-- 分類卡片區 -->
    <div class="container categories-section">
        <div class="category-header">
            <h4>熱門分類</h4>
            <a href="#">查看全部 <i class="fa-solid fa-arrow-right ms-1"></i></a>
        </div>
        <div class="row g-4">
            <!-- 分類 1: 超市情報 -->
            <div class="col-md-3">
                <a href="supermarket.html" class="text-decoration-none">
                    <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1578916171728-46686eac8d58?q=80&w=600&auto=format&fit=crop');">
                        <p class="category-title">超市情報</p>
                        <div class="category-arrow"><i class="fa-solid fa-arrow-up-right"></i></div>
                    </div>
                </a>
            </div>
            <!-- 分類 2: 飲食優惠情報 -->
            <div class="col-md-3">
                <a href="dining.html" class="text-decoration-none">
                    <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=600&auto=format&fit=crop');">
                        <p class="category-title">飲食優惠情報</p>
                        <div class="category-arrow"><i class="fa-solid fa-arrow-up-right"></i></div>
                    </div>
                </a>
            </div>
            <!-- 分類 3: 開倉大減價 -->
            <div class="col-md-3">
                <a href="warehouse.html" class="text-decoration-none">
                    <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1553413077-190dd305871c?q=80&w=600&auto=format&fit=crop');">
                        <p class="category-title">開倉大減價</p>
                        <div class="category-arrow"><i class="fa-solid fa-arrow-up-right"></i></div>
                    </div>
                </a>
            </div>
            <!-- 分類 4: 其他著數 -->
            <div class="col-md-3">
                <a href="others.html" class="text-decoration-none">
                    <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1513161455079-7dc1de15ef3e?q=80&w=600&auto=format&fit=crop');">
                        <p class="category-title">其他著數</p>
                        <div class="category-arrow"><i class="fa-solid fa-arrow-up-right"></i></div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- 今日精選 (惠康專屬優惠) -->
    <div class="container mb-5">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h4 class="section-title mb-0">今日精選 - 惠康 (Wellcome) 超市獨家優惠</h4>
            <span class="badge bg-danger fs-6 px-3 py-2">🔥 9月限定</span>
        </div>

        <div class="wellcome-banner-card">
            <div class="p-2 bg-danger text-white fw-bold px-3"><i class="fa-solid fa-store me-2"></i>惠康超級市場 Wellcome - 新客優惠 85折</div>
            <img src="https://images.unsplash.com/photo-1534723452862-4c874018d66d?q=80&w=1200&auto=format&fit=crop" class="w-100" alt="惠康新客優惠 85折" style="max-height: 380px; object-fit: cover;">
            <div class="p-3 bg-light text-muted small">
                優惠期至2026年9月30日。*新客優惠只限未曾於 Market Place / 惠康 / yuu 網店購物之新用戶 ^最高可享$100優惠。
            </div>
        </div>

        <div class="wellcome-banner-card">
            <div class="p-2 bg-danger text-white fw-bold px-3"><i class="fa-solid fa-store me-2"></i>惠康超級市場 Wellcome - 新客 3 重賞</div>
            <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=1200&auto=format&fit=crop" class="w-100" alt="惠康新客3重賞" style="max-height: 380px; object-fit: cover;">
            <div class="p-3 bg-light text-muted small">
                包羅萬有：指定產品新人價低至半價、首單滿$360*享85折及免運費三重賞！
            </div>
        </div>
    </div>

</body>
</html>
