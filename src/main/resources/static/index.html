<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayBuy 抵Buy - 全港著數導航</title>
    <!-- 引入 Bootstrap 5 (排版) & FontAwesome (圖示) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* 1. 零版權風險嘅專業漸變背景 */
        .hero-section { 
            background: linear-gradient(135deg, #ff4757 0%, #2f3542 100%); 
            color: white; 
            padding: 120px 0 100px 0; 
            text-align: center; 
            margin-bottom: 40px; 
        }
        
        /* 2. 震撼力大字體 */
        .hero-title { 
            font-size: 4rem; 
            font-weight: 900; 
            letter-spacing: 2px; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        
        /* 3. 搜尋框設計 */
        .search-box { 
            max-width: 600px; 
            margin: 30px auto 0; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            border-radius: 50px;
            overflow: hidden;
        }
        .search-box input { border: none; padding: 15px 25px; font-size: 1.1rem; }
        .search-box button { border: none; padding: 15px 30px; font-size: 1.1rem; }

        /* 卡片特效 */
        .discount-card { transition: transform 0.3s, box-shadow 0.3s; border: none; border-radius: 12px; }
        .discount-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- 導航列 (換上 DayBuy 品牌) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-tags me-2 text-danger"></i>DayBuy
            </a>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">超市著數</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">飲食情報</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">信用卡優惠</a></li>
                    <li class="nav-item ms-3">
                        <a class="btn btn-outline-light btn-sm mt-1" href="#"><i class="fa-solid fa-user me-1"></i>登入</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 歡迎橫幅 Hero Banner -->
    <div class="hero-section">
        <div class="container">
            <h1 class="hero-title">全港著數 一網打盡</h1>
            <p class="lead fs-4 mt-3">每日為你搜羅各大商戶最抵情報，對抗通脹！</p>
            
            <!-- 行動呼籲 (Call-To-Action) -->
            <div class="input-group search-box">
                <input type="text" class="form-control" placeholder="搜尋例如：可口可樂、百佳、壽司郎...">
                <button class="btn btn-danger fw-bold" type="button">
                    <i class="fa-solid fa-magnifying-glass me-2"></i>即時格價
                </button>
            </div>
        </div>
    </div>
    
    <!-- 優惠內容區 -->
    <div class="container mb-5">
        <h3 class="fw-bold mb-4 border-bottom pb-2">🔥 今日精選優惠</h3>
        <div class="row g-4" id="discounts-container">
            <!-- 呢度保留咗預設嘅讀取動畫，之後會用 Java 系統將真實優惠放落去 -->
            <div class="col-12 text-center my-5">
                <div class="spinner-border text-danger" role="status"></div>
                <p class="mt-3 text-muted">正在為您連接最新數據庫...</p>
            </div>
        </div>
    </div>

</body>
</html>
