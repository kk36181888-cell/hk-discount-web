<!DOCTYPE html>
<html lang="zh-HK" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待審入貨 - JetsoBanana 後台</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏷️</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header class="p-3 mb-4" style="background-color: #FFDE00; border-bottom: 2px solid #000;">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="text-dark fw-bold fs-4"><i class="fa-solid fa-robot me-2"></i>待審入貨（自動爬蟲草稿）</span>
            <a href="/daybuy-hq" class="btn btn-dark fw-bold"><i class="fa-solid fa-arrow-left me-1"></i>返後台</a>
        </div>
    </header>

    <main class="container mb-5 flex-grow-1">
        <div class="alert alert-info fw-bold" th:if="${#lists.isEmpty(pendingDiscounts)}">
            <i class="fa-solid fa-circle-check me-2"></i>而家冇待審草稿。爬蟲每日入貨後，新草稿會出現在呢度。
        </div>

        <div class="card shadow-sm border-0 rounded-4 mb-3" th:each="item : ${pendingDiscounts}">
            <div class="card-body d-flex flex-wrap gap-3 align-items-start">
                <img th:src="${item.imageUrl}" class="rounded shadow-sm bg-white" style="width: 110px; height: 110px; object-fit: cover;" alt="">
                <div class="flex-grow-1" style="min-width: 260px;">
                    <div class="fw-bold fs-5" th:text="${item.title}">標題</div>
                    <div class="mt-1">
                        <span class="badge bg-warning text-dark">待審</span>
                        <span class="badge bg-secondary" th:text="${item.category}"></span>
                        <span class="badge bg-info text-dark" th:if="${item.sourceName != null}" th:text="${item.sourceName}"></span>
                    </div>
                    <div class="text-muted mt-2">
                        <i class="fa-regular fa-clock me-1"></i><span th:text="${item.promoPeriod}"></span>
                        <span class="ms-2" th:if="${item.endDate != null}">📅 結束：<span th:text="${#temporals.format(item.endDate, 'dd/MM/yyyy')}"></span></span>
                        <span class="ms-2 text-danger fw-bold" th:if="${item.endDate == null}">⚠️ 未抽到結束日期，批准前請編輯補上</span>
                    </div>
                    <div class="text-muted small mt-1" th:if="${item.scrapedAt != null}">
                        抓取時間：<span th:text="${#temporals.format(item.scrapedAt, 'yyyy-MM-dd HH:mm')}"></span>
                        <a th:if="${item.sourceUrl != null}" th:href="${item.sourceUrl}" target="_blank" class="ms-2">官方來源頁 ↗</a>
                    </div>
                </div>
                <div class="d-flex flex-column gap-2">
                    <form th:action="@{/daybuy-hq/review/approve/{id}(id=${item.id})}" method="post">
                        <button type="submit" class="btn btn-success fw-bold w-100"><i class="fa-solid fa-check me-1"></i>批准出街</button>
                    </form>
                    <a th:href="@{/daybuy-hq/edit/{id}(id=${item.id})}" class="btn btn-outline-primary fw-bold"><i class="fa-solid fa-pen me-1"></i>編輯</a>
                    <form th:action="@{/daybuy-hq/review/reject/{id}(id=${item.id})}" method="post" onsubmit="return confirm('確定拒絕並刪除呢條草稿？');">
                        <button type="submit" class="btn btn-outline-danger fw-bold w-100"><i class="fa-solid fa-xmark me-1"></i>拒絕</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <small>JetsoBanana 後台 — 自動入貨待審區</small>
    </footer>
</body>
</html>
