<!DOCTYPE html>
<html lang="zh-HK" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${discount.title} + ' - DayBuy 著數詳情'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .rich-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light">
    
    <header class="p-3 mb-4" style="background-color: #FFDE00; border-bottom: 2px solid #000;">
        <div class="container">
            <a href="/" class="text-dark text-decoration-none fw-bold fs-3"><i class="fa-solid fa-tags me-2"></i>DayBuy 首頁</a>
        </div>
    </header>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    
                    <img th:src="${discount.imageUrl}" class="w-100" style="max-height: 500px; object-fit: contain; background-color: #f1f1f1;" alt="優惠圖片">
                    
                    <div class="card-body p-5">
                        <span class="badge bg-danger mb-3 fs-6" th:if="${discount.category == 'supermarket'}">超市著數</span>
                        <span class="badge bg-warning text-dark mb-3 fs-6" th:if="${discount.category == 'dining'}">飲食優惠</span>
                        <span class="badge bg-danger mb-3 fs-6" th:if="${discount.category == 'warehouse'}">開倉大減價</span>
                        <span class="badge bg-secondary mb-3 fs-6" th:if="${discount.category == 'others'}">其他著數</span>
                        
                        <h1 class="fw-bold mb-4" th:text="${discount.title}">優惠標題</h1>
                        
                        <div class="alert alert-warning fw-bold fs-5 mb-4 border-warning">
                            <i class="fa-regular fa-clock me-2"></i>優惠期: <span th:text="${discount.promoPeriod}"></span>
                        </div>
                        
                        <h4 class="fw-bold border-bottom pb-2 mb-4">優惠詳細圖文內容</h4>
                        
                        <div class="fs-5 text-dark mb-5 rich-content" style="line-height: 1.8; word-wrap: break-word;" th:utext="${discount.description}">
                        </div>
                        
                        <div class="d-grid gap-3">
                            <a href="/" class="btn btn-outline-secondary btn-lg fw-bold py-3">🏠 返回著數列表</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
