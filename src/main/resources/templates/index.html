<!DOCTYPE html>
<html lang="zh-HK" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayBuy 抵Buy - 全港著數導航</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #ffffff; 
            color: #333333; 
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; 
        }
        
        .top-header { background-color: #FFDE00; padding: 15px 0; border-bottom: 1px solid #e0c200; }
        .brand-logo { font-size: 2rem; font-weight: bold; color: #000; text-decoration: none; }
        .brand-logo i { color: #000; }

        .sub-nav { background-color: #FFDE00; border-bottom: 2px solid #000; margin-bottom: 40px; }
        .sub-nav a { color: #000; text-decoration: none; padding: 12px 25px; display: inline-block; font-weight: bold; transition: background-color 0.2s; }
        .sub-nav a:hover, .sub-nav a.active { background-color: #000; color: #FFDE00; }

        .categories-section { margin-bottom: 40px; }
        .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .category-header h4 { font-weight: bold; margin: 0; color: #000; }
        .category-header a { color: #666; text-decoration: none; font-size: 0.95rem; }
        .category-header a:hover { color: #000; }
        
        .category-card {
            height: 280px;
            border-radius: 12px;
            position: relative;
            background-size: cover;
            background-position: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            cursor: pointer;
        }
        .category-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        
        .category-title {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-weight: bold;
            font-size: 1.25rem;
            z-index: 2;
            margin: 0;
        }
        .category-arrow {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            color: black;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .section-title { font-weight: bold; margin-bottom: 25px; color: #000; border-left: 5px solid #FFDE00; padding-left: 12px; }
        
        .wellcome-banner-card {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
            background: #fff;
        }
        
        /* 升級：成張卡片滑鼠指埋去會有微微發光同浮起效果 */
        .wellcome-banner-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 222, 0, 0.4);
        }
        
        .discount-link-wrapper {
            transition: opacity 0.2s;
        }
        .discount-link-wrapper:hover {
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="container d-flex flex-wrap align-items-center justify-content-start">
            <div>
                <a href="/" class="brand-logo"><i class="fa-solid fa-tags me-2"></i>DayBuy</a>
            </div>
        </div>
    </header>

    <nav class="sub-nav text-center">
        <div class="container">
            <a href="/" class="active"><i class="fa-solid fa-house me-2"></i>首頁</a>
            <a href="/supermarket"><i class="fa-solid fa-fire me-2"></i>超市著數</a>
            <a href="/faq"><i class="fa-solid fa-circle-question me-2"></i>常見問題</a>
        </div>
    </nav>

    <div class="container categories-section">
        <div class="category-header">
            <h4>熱門分類</h4>
            <a href="#">查看全部 <i class="fa-solid fa-arrow-right ms-1"></i></a>
        </div>
        <div class="row g-4">
            <div class="col-md-3">
                <a href="/supermarket" class="text-decoration-none">
                    <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1578916171728-46686eac8d58?q=80&w=600&auto=format&fit=crop');">
                        <p class="category-title">超市情報</p>
                        <div class="category-arrow"><i class="fa-solid fa-arrow-up-right"></i></div>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="/dining" class="text-decoration-none">
                    <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=600&auto=format&fit=crop');">
                        <p class="category-title">飲食優惠情報</p>
                        <div class="category-arrow"><i class="fa-solid fa-arrow-up-right"></i></div>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="/warehouse" class="text-decoration-none">
                    <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1553413077-190dd305871c?q=80&w=600&auto=format&fit=crop');">
                        <p class="category-title">開倉大減價</p>
                        <div class="category-arrow"><i class="fa-solid fa-arrow-up-right"></i></div>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="/others" class="text-decoration-none">
                    <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1513161455079-7dc1de15ef3e?q=80&w=600&auto=format&fit=crop');">
                        <p class="category-title">其他著數</p>
                        <div class="category-arrow"><i class="fa-solid fa-arrow-up-right"></i></div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h4 class="section-title mb-0">🔥 最新著數優惠</h4>
        </div>

        <!-- 🌟 最新升級版優惠卡片 -->
        <div th:each="discount : ${discounts}" class="wellcome-banner-card mb-5" style="border: 2px solid #FFDE00;">
            <!-- 連去自己網站嘅詳細頁面，target="_blank" 代表彈出新分頁 -->
            <a th:href="@{/discount/{id}(id=${discount.id})}" target="_blank" class="text-decoration-none text-dark d-block discount-link-wrapper">
                
                <div class="p-3 bg-danger text-white fw-bold px-4 fs-4">
                    <i class="fa-solid fa-fire me-2"></i><span th:text="${discount.title}">優惠標題</span>
                </div>
                
                <img th:src="${discount.imageUrl}" class="w-100" alt="優惠圖片" style="max-height: 450px; object-fit: cover;">
                
                <div class="p-4 bg-light">
                    <div class="text-danger fw-bold fs-4 mb-3">
                        🕒 優惠期: <span th:text="${discount.promoPeriod}"></span>
                    </div>
                    
                    <div class="fs-5 text-muted mb-4" th:text="${discount.description}"></div>
                    
                    <!-- 搶眼嘅跳轉按鈕 -->
                    <button class="btn btn-warning w-100 fw-bold fs-4 py-3" style="box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                        👉 點擊查看詳細內容
                    </button>
                </div>
            </a>
        </div>
        
        <!-- 如果暫時冇資料，會顯示呢句提示 -->
        <div th:if="${#lists.isEmpty(discounts)}" class="text-center py-5 text-muted">
            <h4><i class="fa-solid fa-box-open me-2"></i>目前未有最新優惠</h4>
            <p>請稍後再嚟睇下啦！</p>
        </div>

    </div>
</body>
</html>
