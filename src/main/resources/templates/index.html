<!DOCTYPE html>
<html lang="zh-HK" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DayBuy - 優惠大放送</title>
    <!-- 引入 Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- 頂部導航列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🛒 DayBuy</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link" href="/supermarket">超市情報</a>
                <a class="nav-link" href="/dining">飲食優惠</a>
                <a class="nav-link" href="/warehouse">倉儲特賣</a>
                <a class="nav-link" href="/others">其他</a>
                <!-- 捷徑：去管理員後台 -->
                <a class="nav-link text-warning fw-bold ms-3" href="/admin">⚙️ 後台管理</a>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <div class="container">
        <h2 class="mb-4 text-center fw-bold text-primary">🔥 最新著數優惠</h2>
        
        <div class="row row-cols-1 row-cols-md-3 g-4">
            
            <!-- Thymeleaf 迴圈：由 Database 抽出所有優惠並顯示成卡片 -->
            <div class="col" th:each="discount : ${discounts}">
                <div class="card h-100 shadow-sm border-0">
                    <!-- 優惠圖片 -->
                    <img th:src="${discount.imageUrl}" class="card-img-top" alt="優惠圖片" style="height: 200px; object-fit: cover;">
                    
                    <div class="card-body d-flex flex-column">
                        <!-- 標題 -->
                        <h5 class="card-title fw-bold" th:text="${discount.title}">優惠標題</h5>
                        <!-- 期限 -->
                        <p class="text-danger fw-bold mb-2">
                            🕒 優惠期: <span th:text="${discount.promoPeriod}"></span>
                        </p>
                        <!-- 內容 -->
                        <p class="card-text text-muted flex-grow-1" th:text="${discount.description}">優惠詳細內容...</p>
                        
                        <!-- 🗑️ 刪除按鈕 (帶有防錯彈窗確認機制) -->
                        <form th:action="@{/admin/delete/{id}(id=${discount.id})}" method="post" onsubmit="return confirm('確定要刪除呢個優惠嗎？');" class="mt-3">
                            <button type="submit" class="btn btn-sm btn-outline-danger w-100">🗑️ 刪除優惠</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
        
        <!-- 如果 Database 係空嘅，會顯示呢句提示 -->
        <div th:if="${#lists.isEmpty(discounts)}" class="text-center mt-5 text-muted">
            <h4>暫時未有優惠，快啲去 <a href="/admin" class="text-decoration-none">後台管理</a> 加啲啦！</h4>
        </div>
    </div>

</body>
</html>>
