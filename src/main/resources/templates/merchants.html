<!DOCTYPE html>
<html lang="zh-HK" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JetsoBanana 商戶專頁 - 按商戶睇晒全部著數優惠。">
    <meta property="og:title" content="JetsoBanana - 商戶專頁">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍌</text></svg>">
    <title>商戶專頁 - JetsoBanana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; color: #333333; font-family: Arial, sans-serif; }
        .top-header { background-color: #FFDE00; padding: 15px 0; border-bottom: 1px solid #e0c200; }
        .brand-logo { font-size: 2rem; font-weight: bold; color: #000; text-decoration: none; }
        .sub-nav { background-color: #FFDE00; border-bottom: 2px solid #000; margin-bottom: 40px; }
        .sub-nav a { color: #000; text-decoration: none; padding: 12px 25px; display: inline-block; font-weight: bold; transition: background-color 0.2s; }
        .sub-nav a:hover, .sub-nav a.active { background-color: #000; color: #FFDE00; }
        .merchant-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .merchant-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="top-header">
        <div class="container d-flex flex-wrap align-items-center justify-content-between">
            <a href="/" class="brand-logo mb-2 mb-md-0"><span class="me-2">🍌</span>JetsoBanana</a>
            <form class="d-flex" action="/search" method="get">
                <input class="form-control me-2" type="search" name="keyword" placeholder="搵優惠 (例: 百佳)..." required>
                <button class="btn btn-dark fw-bold" type="submit" style="white-space: nowrap;"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
        </div>
    </header>

    <nav class="sub-nav text-center" aria-label="主導航">
        <div class="container">
            <a href="/"><i class="fa-solid fa-house me-2"></i>首頁</a>
            <a href="/supermarket"><i class="fa-solid fa-cart-shopping me-2"></i>超市著數</a>
            <a href="/dining"><i class="fa-solid fa-utensils me-2"></i>飲食優惠</a>
            <a href="/warehouse"><i class="fa-solid fa-box-open me-2"></i>開倉減價</a>
            <a href="/others"><i class="fa-solid fa-gift me-2"></i>其他著數</a>
            <a href="/merchants" class="active"><i class="fa-solid fa-store me-2"></i>商戶專頁</a>
            <a href="/faq"><i class="fa-solid fa-circle-question me-2"></i>常見問題</a>
        </div>
    </nav>

    <main class="container mb-5 flex-grow-1">
        <h4 class="fw-bold mb-4" style="border-left: 5px solid #FFDE00; padding-left: 12px; color: #000;">
            🏪 商戶專頁
        </h4>
        <p class="text-muted mb-4">撳入商戶名，就可以睇晒嗰個商戶嘅全部著數優惠。</p>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="entry : ${merchantList}">
                <a th:href="@{/merchant/{name}(name=${entry.key})}" class="text-decoration-none text-dark d-block h-100">
                    <div class="card merchant-card h-100">
                        <div class="card-body p-4 d-flex align-items-center justify-content-between">
                            <span class="fw-bold fs-4">🏪 <span th:text="${entry.key}">商戶</span></span>
                            <span class="badge bg-warning text-dark fs-6" th:text="${entry.value} + ' 個優惠'">0 個優惠</span>
                        </div>
                        <div class="card-footer bg-white border-0 pb-3">
                            <span class="btn btn-dark w-100 fw-bold">睇晒全部優惠 →</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(merchantList)}" class="text-center py-5 text-muted">
            <h4 class="mb-4">目前未有商戶資料</h4>
            <a href="/" class="btn btn-outline-dark btn-lg fw-bold"><i class="fa-solid fa-house me-2"></i>返回所有優惠</a>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-1 fw-bold fs-5"><span class="me-2">🍌</span>JetsoBanana 著數情報網</p>
            <p class="mb-2">© 2026 JetsoBanana. All rights reserved.</p>
            <small class="text-secondary" style="font-size: 0.8rem;">
                免責聲明：本網站僅為優惠資訊整合平台，旨在為大眾提供免費著數情報。所有優惠詳情、條款及細則均以官方公佈為準。本站與相關商戶無任何直接交易或從屬關係，亦不對任何交易損失負責。
            </small>
        </div>
    </footer>

</body>
</html>
