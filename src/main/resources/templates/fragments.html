<!-- 🏪 共用 fragment：優惠卡片（首頁分組版同分類／搜尋／商戶頁扁平版共用，
     改卡面只改呢度，唔使兩邊同步。呢個檔案本身唔係一個頁面，唔會直接顯示。） -->
<th:block th:fragment="dealCard(discount)" xmlns:th="http://www.thymeleaf.org">
    <article class="col">
        <a th:href="@{/discount/{id}(id=${discount.id})}" target="_blank" class="text-decoration-none text-dark d-block h-100">
            <div class="wellcome-banner-card">
                <div class="p-3 fw-bold px-3 carved-title-bar">
                    <i class="fa-solid fa-tag me-2"></i><span th:text="${discount.title}">優惠標題</span>
                </div>
                <div class="card-img-wrapper" th:if="${discount.imageUrl != null and discount.imageUrl != ''}">
                    <!-- 🚀 效能與 SEO 核心升級：加入 loading="lazy" 同埋動態 alt 文字 -->
                    <img th:src="${discount.imageUrl}" th:alt="${discount.title} + ' 優惠宣傳圖'" loading="lazy">
                </div>
                <div class="card-text-cover" th:unless="${discount.imageUrl != null and discount.imageUrl != ''}">
                    <div class="cover-merchant"><i class="fa-solid fa-store me-2"></i><span th:text="${discount.merchantDisplay}">商戶</span></div>
                    <div class="cover-title" th:text="${discount.title}">優惠標題</div>
                </div>
                <div class="card-content bg-white">
                    <!-- 卡面只顯示一個日期：有結束日期先顯示下面嘅統一格式徽章；
                         冇結束日期就唔顯示優惠期嗰行（舊版會重複標題原文），優惠期全文留喺詳情頁 -->
                    <div class="text-muted mb-2" style="font-size: 0.9rem;" th:if="${discount.merchantDisplay != null}">
                        <span th:if="${discount.merchantDisplay != null}"><i class="fa-solid fa-store me-2"></i> <span th:text="${discount.merchantDisplay}"></span></span>
                    </div>
                    <!-- 📅 到期提示 (有填結束日期先顯示，統一 dd/MM/yyyy 格式)：最後今日/剩 X 日行紅色，日子充裕就灰色顯示結束日期 -->
                    <div class="mb-2" th:if="${discount.endDate != null}">
                        <span class="badge bg-danger" th:if="${discount.daysRemaining == 0}"><i class="fa-solid fa-fire me-1"></i>最後今日</span>
                        <span class="badge bg-danger" th:if="${discount.daysRemaining != null and discount.daysRemaining > 0 and discount.daysRemaining <= 3}"><i class="fa-regular fa-clock me-1"></i><span th:text="'剩返 ' + ${discount.daysRemaining} + ' 日咋'"></span></span>
                        <span class="badge bg-secondary" th:if="${discount.daysRemaining != null and discount.daysRemaining > 3}"><i class="fa-solid fa-calendar-days me-1"></i><span th:text="'至 ' + ${#temporals.format(discount.endDate, 'dd/MM/yyyy')} + ' 止'"></span></span>
                    </div>
                    <!-- 卡面描述已移除：全文描述留喺詳情頁，卡面只留標題＋圖＋商戶＋日期，唔再成段貼上嚟斷句 -->

                    <button class="btn btn-dark w-100 fw-bold mt-auto" style="box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                        <i class="fa-solid fa-arrow-right me-1"></i>查看圖文詳情
                    </button>
                </div>
            </div>
        </a>
    </article>
</th:block>
