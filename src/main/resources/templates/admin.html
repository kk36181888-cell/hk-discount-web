<!DOCTYPE html>
<html lang="zh-HK" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DayBuy - 優惠管理後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light pb-5">
    <div class="container mt-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">DayBuy 後台控制中心</h2>
            <div class="d-flex gap-2">
                <!-- 爬蟲按鈕 -->
                <form th:action="@{/admin/scrape}" method="post" onsubmit="return confirm('準備派出爬蟲機械人去搵著數？\n\n注意：大約需要 1-2 秒時間抓取數據。');">
                    <button type="submit" class="btn btn-warning fw-bold">🤖 一鍵自動抓取</button>
                </form>
                <a href="/" class="btn btn-outline-secondary">🏠 返回首頁</a>
            </div>
        </div>

        <div class="card shadow-sm mb-5 border-0">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">⚙️ 新增優惠</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/add}" th:object="${discount}" method="post">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">優惠標題</label>
                            <input type="text" class="form-control" th:field="*{title}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">優惠期限</label>
                            <input type="text" class="form-control" th:field="*{promoPeriod}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">所屬分類</label>
                            <select class="form-select" th:field="*{category}" required>
                                <option value="" selected>請選擇分類...</option>
                                <option value="supermarket">超市情報</option>
                                <option value="dining">飲食優惠</option>
                                <option value="warehouse">倉儲特賣</option>
                                <option value="others">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">圖片網址</label>
                        <input type="text" class="form-control" th:field="*{imageUrl}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">詳細內容</label>
                        <textarea class="form-control" th:field="*{description}" rows="2"></textarea>
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-success px-4">✅ 發佈優惠</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">📋 現有優惠管理</h5>
            </div>
            <div class="table-responsive">
                <table class="table table-hover bg-white mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th width="5%" class="text-center">ID</th>
                            <th width="10%">分類</th>
                            <th width="25%">標題</th>
                            <th width="25%">期限</th>
                            <th width="20%">圖片 (預覽)</th>
                            <th width="15%" class="text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${discounts}">
                            <td class="text-center fw-bold" th:text="${d.id}"></td>
                            <td th:text="${d.category}"></td>
                            <td th:text="${d.title}"></td>
                            <td th:text="${d.promoPeriod}"></td>
                            <td>
                                <img th:src="${d.imageUrl}" style="height: 40px; border-radius: 4px; object-fit: cover;">
                            </td>
                            <td class="text-center">
                                <form th:action="@{/admin/delete/{id}(id=${d.id})}" method="post" onsubmit="return confirm('確定要刪除呢個優惠嗎？');">
                                    <button type="submit" class="btn btn-sm btn-danger">🗑️ 刪除</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(discounts)}">
                            <td colspan="6" class="text-center text-muted py-4">暫時未有任何優惠</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
