<!DOCTYPE html>
<html lang="zh-HK" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DayBuy - 高級控制總部</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="bg-dark text-white p-4 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h2 class="mb-0"><i class="fa-solid fa-user-secret me-2"></i>DayBuy 高級控制總部</h2>
            <div class="d-flex gap-2">
                <form th:action="@{/daybuy-hq/delete-all}" method="post" onsubmit="return confirm('確定清空所有資料？');">
                    <button type="submit" class="btn btn-danger fw-bold">🗑️ 一鍵清空</button>
                </form>
                <a href="/" class="btn btn-outline-light">返回首頁</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-secondary text-white fw-bold">➕ 新增優惠</div>
            <div class="card-body">
                <form th:action="@{/daybuy-hq/add}" th:object="${discount}" method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">優惠標題</label>
                            <input type="text" th:field="*{title}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">優惠類別</label>
                            <select th:field="*{category}" class="form-select">
                                <option value="supermarket">超市著數</option>
                                <option value="dining">飲食優惠</option>
                                <option value="warehouse">開倉大減價</option>
                                <option value="others">其他著數</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">圖片網址</label>
                            <input type="url" th:field="*{imageUrl}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-primary">🔗 點擊跳轉超連結 (新功能)</label>
                            <input type="url" th:field="*{linkUrl}" class="form-control" placeholder="例如: https://..." required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">優惠期限</label>
                            <input type="text" th:field="*{promoPeriod}" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">詳細內容</label>
                        <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-success fw-bold">發佈優惠</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th><th>標題</th><th>圖片</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${discounts}">
                            <td th:text="${d.id}"></td>
                            <td th:text="${d.title}"></td>
                            <td><img th:src="${d.imageUrl}" style="height:40px;"></td>
                            <td>
                                <form th:action="@{/daybuy-hq/delete/{id}(id=${d.id})}" method="post">
                                    <button class="btn btn-sm btn-danger">刪除</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
