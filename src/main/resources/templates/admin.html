<!DOCTYPE html>
<html lang="zh-HK" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JetsoBanana 著數後台管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🌟 TinyMCE 富文本編輯器 (改用 jsDelivr 自托管開源版，唔使 API 金鑰)
         ⚠️ 之前用 cdn.tiny.cloud/1/no-api-key/ 會被官方鎖死編輯區 (顯示 "A valid API key is required")，後台一直入唔到描述，2026-10-23 修復 -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
    <script>
      tinymce.init({
        selector: '#description',
        license_key: 'gpl',
        height: 380,
        plugins: 'lists link image preview code',
        toolbar: 'undo redo | bold italic | alignleft aligncenter alignright | bullist numlist | link image | code',
        branding: false,
        promotion: false
      });
    </script>
</head>
<body class="bg-light">
    
    <!-- 頂部管理導航列 -->
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a href="/daybuy-hq" class="navbar-brand mb-0 h1 text-decoration-none">
                <i class="fa-solid fa-gear me-2 text-warning"></i>JetsoBanana 後台管理系統 (HQ)
            </a>
            <div class="d-flex gap-2 align-items-center">
                <a href="/" class="btn btn-outline-light btn-sm fw-bold" target="_blank">
                    <i class="fa-solid fa-eye me-1"></i>預覽前台
                </a>
                <form th:action="@{/daybuy-hq/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-danger btn-sm fw-bold">
                        <i class="fa-solid fa-right-from-bracket me-1"></i>安全登出
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row">
            <!-- 左邊：新增 / 編輯優惠表單 -->
            <div class="col-lg-5 mb-4">
                <div class="card shadow-sm border-0 rounded-4">
                    <!-- 根據 id 判斷係「發佈新優惠」定係「編輯模式」 -->
                    <div class="card-header fw-bold fs-5 py-3" 
                         th:classappend="${discount.id == null ? 'bg-warning text-dark' : 'bg-primary text-white'}">
                        <i class="fa-solid me-2" th:classappend="${discount.id == null ? 'fa-plus-circle' : 'fa-pen-to-square'}"></i>
                        <span th:text="${discount.id == null ? '發佈新著數優惠' : '正在編輯優惠 (ID: ' + discount.id + ')'}"></span>
                    </div>
                    <div class="card-body p-4">
                        <!-- 🌟 關鍵 1：加入 enctype="multipart/form-data" 支援檔案上傳 -->
                        <form th:action="@{/daybuy-hq/add}" th:object="${discount}" method="post" enctype="multipart/form-data">
                            <!-- 🌟 關鍵隱藏欄位：儲存 ID 用於判斷新增定更新 -->
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">分類標籤</label>
                                <select class="form-select" th:field="*{category}" required>
                                    <option value="supermarket">🛒 超市著數 (Supermarket)</option>
                                    <option value="dining">🍽️ 飲食優惠 (Dining)</option>
                                    <option value="warehouse">📦 開倉大減價 (Warehouse)</option>
                                    <option value="others">🎁 其他著數 (Others)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">發佈狀態</label>
                                <select class="form-select" th:field="*{status}">
                                    <option value="PUBLISHED">✅ 公開中 (PUBLISHED)</option>
                                    <option value="PENDING">📥 待審草稿 (PENDING)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">優惠標題</label>
                                <input type="text" class="form-control" th:field="*{title}" placeholder="例：百佳超級市場 本週激抵優惠" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">商戶 (Merchant)</label>
                                <input type="text" class="form-control" th:field="*{merchant}" placeholder="例：惠康（留空會由標題自動推斷）">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">優惠期 (Promo Period)</label>
                                <input type="text" class="form-control" th:field="*{promoPeriod}" placeholder="例：即日起至 10 月 31 日" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">📅 優惠結束日期 (End Date)</label>
                                <input type="date" class="form-control" th:field="*{endDate}">
                                <small class="text-muted">填咗先識計「剩 X 日」同過期自動隱藏；長期優惠可以留空。</small>
                            </div>

                            <!-- 🌟 關鍵 2：封面圖片（直接揀檔案 OR 貼網址二選一） -->
                            <div class="mb-3 p-3 bg-white border border-success rounded-3">
                                <label class="form-label fw-bold text-success">
                                    <i class="fa-solid fa-cloud-arrow-up me-1"></i>封面圖片：直接揀相上載 (推薦)
                                </label>
                                <input type="file" name="coverImageFile" class="form-control mb-2" accept="image/*">
                                <small class="text-muted d-block mb-1">或者手動貼上圖片網址 (如已揀檔案，系統會自動用上載嘅相)：</small>
                                <input type="url" class="form-control form-control-sm" th:field="*{imageUrl}" placeholder="https://... (選填)">
                            </div>
                            
                            <!-- 🌟 關鍵 3：額外多張單張（支援撳住 Ctrl 一次過揀多張相！） -->
                            <div class="mb-3 p-3 bg-white border border-primary rounded-3">
                                <label class="form-label fw-bold text-primary">
                                    <i class="fa-regular fa-images me-1"></i>額外單張圖片：批量揀選多張檔案 (可選)
                                </label>
                                <input type="file" name="extraImageFiles" class="form-control mb-2" accept="image/*" multiple>
                                <small class="text-muted d-block mb-1">已儲存或額外手動貼上嘅圖片網址 (每行一條)：</small>
                                <textarea class="form-control form-control-sm" th:field="*{additionalImages}" rows="3" placeholder="每行貼一條圖片直連網址"></textarea>
                            </div>

                            <div class="mb-3 p-3 bg-white border rounded-3">
                                <label class="form-label fw-bold">官方來源 (有先會喺詳情頁顯示)</label>
                                <input type="text" class="form-control mb-2" th:field="*{sourceName}" placeholder="例：惠康官方網店">
                                <input type="url" class="form-control form-control-sm" th:field="*{sourceUrl}" placeholder="官方活動頁連結 https://... (選填)">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">詳細圖文內容 (Description)</label>
                                <textarea id="description" class="form-control" th:field="*{description}" rows="8"></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">條款撮要 (Terms)</label>
                                <textarea class="form-control" th:field="*{terms}" rows="4" placeholder="例：每人限換一次；數量有限，換完即止（留空就唔顯示呢區）"></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn fw-bold py-2" 
                                        th:classappend="${discount.id == null ? 'btn-success' : 'btn-primary'}">
                                    <i class="fa-solid fa-cloud-arrow-up me-2"></i>
                                    <span th:text="${discount.id == null ? '確認上載並發佈' : '儲存修改更新'}"></span>
                                </button>
                                <!-- 編輯模式下顯示「取消編輯」掣 -->
                                <a href="/daybuy-hq" class="btn btn-outline-secondary fw-bold" th:if="${discount.id != null}">
                                    <i class="fa-solid fa-xmark me-1"></i>取消編輯（返回新增模式）
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 右邊：已發佈優惠列表 -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-dark text-white fw-bold fs-5 py-3 d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid fa-list me-2"></i>已上架優惠 (<span th:text="${#lists.size(discounts)}">0</span>)</span>
                        <a href="/daybuy-hq/review" class="btn btn-warning btn-sm fw-bold">
                            <i class="fa-solid fa-robot me-1"></i>待審入貨
                            <span class="badge bg-danger" th:if="${pendingCount != null and pendingCount > 0}" th:text="${pendingCount}">0</span>
                        </a>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">封面</th>
                                        <th>標題 / 分類 / 優惠期</th>
                                        <th>瀏覽量</th>
                                        <th class="text-end pe-3">管理操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${discounts}" th:classappend="${discount.id == item.id ? 'table-primary' : ''}">
                                        <td class="ps-3" style="width: 80px;">
                                            <img th:src="${item.imageUrl}" class="rounded shadow-sm bg-white" style="width: 60px; height: 60px; object-fit: cover;">
                                        </td>
                                        <td>
                                            <div class="fw-bold text-truncate" style="max-width: 260px;" th:text="${item.title}"></div>
                                            <span class="badge bg-secondary me-1" th:text="${item.category}"></span>
                                            <small class="text-muted"><i class="fa-regular fa-clock me-1"></i><span th:text="${item.promoPeriod}"></span></small>
                                            <span class="badge bg-dark ms-1" th:if="${item.endDate != null}" th:text="'至 ' + ${#temporals.format(item.endDate, 'dd/MM/yyyy')}"></span>
                                            <span class="badge bg-danger ms-1" th:if="${item.expired}">已過期（前台已隱藏）</span>
                                            <span class="badge bg-warning text-dark ms-1" th:if="${item.status == 'PENDING'}">待審</span>
                                            <span class="badge bg-success ms-1" th:if="${item.status == null or item.status == 'PUBLISHED'}">公開中</span>
                                        </td>
                                        <td>
                                            <span class="badge bg-warning text-dark rounded-pill">
                                                <i class="fa-solid fa-fire text-danger me-1"></i><span th:text="${item.viewCount}">0</span>
                                            </span>
                                        </td>
                                        <td class="text-end pe-3" style="min-width: 130px;">
                                            <!-- ✏️ 編輯按鈕 -->
                                            <a th:href="@{/daybuy-hq/edit/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary me-1" title="編輯此優惠">
                                                <i class="fa-solid fa-pen"></i>
                                            </a>
                                            <!-- 🗑️ 刪除按鈕 (用 POST 表單防止誤觸) -->
                                            <form th:action="@{/daybuy-hq/delete/{id}(id=${item.id})}" method="post" class="d-inline" onsubmit="return confirm('確定要永久刪除呢個優惠嗎？');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="刪除">
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(discounts)}">
                                        <td colspan="4" class="text-center py-5 text-muted">
                                            <i class="fa-solid fa-box-open fs-2 mb-3"></i>
                                            <p class="mb-0">暫時未有任何優惠，快啲喺左邊發佈第一個啦！</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
